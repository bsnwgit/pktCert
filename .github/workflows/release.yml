# Attaches the self-update package to a GitHub Release once it's
# published. A release is cut by hand (`gh release create`) —
# this only builds and uploads the asset the running app downloads for
# Settings → General → self-update (see app/self_update.py).
#
# The tag is the source of truth: everything in the tarball is checked out
# at the tag, not at whatever's newest on main, so the asset always matches
# the release it's attached to.
name: Release package

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npm run build

      - name: Package release asset
        run: |
          tag="${{ github.event.release.tag_name }}"
          stage="pktcert-${tag}"
          mkdir -p "$stage"
          [ -d app ] && cp -r app "$stage/"
          [ -d migrations ] && cp -r migrations "$stage/"
          [ -d docs ] && cp -r docs "$stage/"
          cp VERSION requirements.txt "$stage/"
          mkdir -p "$stage/frontend"
          cp -r frontend/dist "$stage/frontend/dist"
          tar -czf "${stage}.tar.gz" "$stage"

      - name: Upload to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" "pktcert-${{ github.event.release.tag_name }}.tar.gz" --clobber
